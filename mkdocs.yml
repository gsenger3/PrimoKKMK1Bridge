# The user guide as a website, published to GitHub Pages from the gh-pages branch:
# https://gsenger3.github.io/PrimoKKMK1Bridge/
# Build, preview or publish it with tools/build_site.sh, which makes the page from doc/GUIDE.md first.
# The design follows the Discography User Guide: MkDocs' built-in theme with a few overrides (doc/site/), here a piano
# black header with the editor's app icon, and the guide's table of contents in the sidebar on the left.

site_name: PrimoKKMK1Bridge User Guide
site_url: https://gsenger3.github.io/PrimoKKMK1Bridge/
site_description: >-
  Use a Native Instruments Komplete Kontrol S-series MK1 keyboard on macOS without NI's software: as MIDI, or as a
  REAPER control surface.
repo_url: https://github.com/gsenger3/PrimoKKMK1Bridge
edit_uri: ""  # the page is generated; edit doc/GUIDE.md instead
copyright: >-
  Copyright &copy; 2026 Primo Studios / George Senger. MIT License.<br/>
  Not affiliated with Native Instruments; Komplete Kontrol is their trademark.

docs_dir: build/site-docs  # made by tools/build_site.sh from doc/GUIDE.md, doc/img and doc/site/stylesheets
site_dir: build/site

theme:
  name: mkdocs
  custom_dir: doc/site/overrides
  navigation_depth: 3  # the sidebar lists the guide's sections and their subsections

extra_css:
  - stylesheets/guide.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      use_pygments: false  # the theme's highlight.js colours the code
  - pymdownx.superfences  # code blocks inside list items too

validation:
  links:
    not_found: warn
    anchors: warn
